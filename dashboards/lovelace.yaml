# Tableau de bord par défaut « Domolaunaguet » (url_path: lovelace, mode storage).
# 9 vues. Nécessite les 4 ressources listées dans dashboards/resources.yaml
# (Mushroom, mini-graph-card, meteo-france-weather-card, card-mod).
# Export Home Assistant du 2026-08-30.
---
title: Domolaunaguet
views:
- theme: Backend-selected
  title: Général
  path: general
  icon: mdi:home
  badges: []
  cards:
  - type: horizontal-stack
    cards:
    - type: gauge
      entity: sensor.moyenne_temperature_interieure
      name: 'Température intérieure '
      unit: °C
      min: 16
      max: 30
      needle: false
      severity:
        green: 18
        yellow: 25
        red: 27
    - type: gauge
      name: 'Température extérieure '
      unit: °C
      needle: false
      max: 45
      min: -10
      severity:
        green: 5
        yellow: 24
        red: 34
      entity: sensor.moyenne_temperature_exterieure
  - type: custom:meteo-france-weather-card
    entity: weather.launaguet
    rainChanceEntity: sensor.launaguet_rain_chance
    snowChanceEntity: sensor.launaguet_snow_chance
    thunderChanceEntity: sensor.launaguet_thunder_chance
    uvEntity: sensor.launaguet_uv
    icons: null
    rainForecastEntity: sensor.launaguet_next_rain
    cloudCoverEntity: sensor.launaguet_cloud_cover
    freezeChanceEntity: weather.launaguet
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: 'Volets '
      alignment: start
    - type: custom:mushroom-cover-card
      entity: cover.tous_les_volets
      show_position_control: false
      show_buttons_control: true
      fill_container: true
      layout: vertical
      show_tilt_position_control: false
      primary_info: name
      secondary_info: state
      icon_type: none
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-cover-card
        entity: cover.volets_rez_de_chaussee
        show_position_control: false
        show_tilt_position_control: false
        show_buttons_control: true
        primary_info: name
        secondary_info: none
        icon_type: none
      - type: custom:mushroom-cover-card
        entity: cover.volets_etage
        show_position_control: false
        show_buttons_control: true
        secondary_info: none
        icon_type: none
  - type: custom:mushroom-cover-card
    name: Porte de garage
    show_position_control: false
    show_buttons_control: true
    fill_container: true
    layout: vertical
    entity: cover.porte_de_garage
    icon: mdi:garage
    icon_type: none
  - type: custom:mushroom-title-card
    title: 'Éclairage '
    alignment: start
  - type: horizontal-stack
    cards:
    - type: button
      show_name: true
      show_icon: true
      tap_action:
        action: call-service
        service: light.turn_off
        entity: light.toutes_les_lumieres
        target:
          entity_id: light.toutes_les_lumieres
      name: Eteindre Toutes les lumières
      icon_height: 40px
    - type: markdown
      content: '{% set n = states(''sensor.toutes'').split(''/'')[0] | int(0) %}## {% if n == 0 %}Aucune lumière allumée{%
        elif n == 1 %}💡 1 lumière allumée{% else %}💡 {{ n }} lumières allumées{% endif %}'
  - type: custom:mushroom-title-card
    title: 'Automatisation '
    alignment: start
  - type: tile
    features_position: bottom
    vertical: true
    entity: script.depart_maison
    show_entity_picture: true
    hide_state: true
    tap_action:
      action: perform-action
      perform_action: script.depart_maison
      target: {}
    hold_action:
      action: more-info
    visibility:
    - condition: state
      entity: input_boolean.etat_depart_maison
      state: 'off'
  - type: tile
    features_position: bottom
    vertical: true
    entity: script.retour_maison
    show_entity_picture: true
    hide_state: true
    tap_action:
      action: perform-action
      perform_action: script.retour_maison
      target: {}
    hold_action:
      action: more-info
    visibility:
    - condition: state
      entity: input_boolean.etat_depart_maison
      state: 'on'
