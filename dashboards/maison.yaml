# Tableau de bord « Maison » (url_path: maison-v2, mode storage) — refonte, étape 2.
# Cinq vues : Maison, Pièces, Confort, Sécurité, et Technique réservée au compte
# admin. Plus 21 sous-vues, une par pièce.
# Visible de tous. Aucune ressource HACS : natif Home Assistant uniquement.
#
# Le tableau de bord historique « Domolaunaguet » (url_path: lovelace) n'est pas
# touché et reste le tableau par défaut tant qu'on n'a pas basculé.
#
# La section « Attention » est conditionnée par un OU sur 18 déclencheurs : elle
# n'apparaît pas du tout quand tout va bien. Chaque carte à l'intérieur porte en
# plus sa propre condition, donc seule la ligne concernée s'affiche.
#
# Les ouvrants Tydom parlent en LOCKED / UNLOCKED, plus « unknown » au démarrage.
# Les conditions filtrent sur UNLOCKED et OPENED — une correspondance positive,
# pour qu'un « unknown » transitoire ne déclenche pas de fausse alerte.
#
# Les badges portent show_name ET show_state : sans show_name, une puce n'affiche
# que sa valeur, sans dire de quoi elle parle.
#
# Aucun badge de personne : person.marine et person.domolaunaguet ne disaient rien
# d'utile (« Maison » / « Absent » toute la journée) et prenaient la place des
# mesures. Sur Sécurité, c'est la porte de garage qui les remplace.
#
# La température extérieure affichée est sensor.moyenne_temperature_exterieure,
# pas Météo France seul : la moyenne combine la sonde de la chaudière (1.1.35),
# la sonde extérieure de la clim et la prévision Météo France. C'est la valeur
# mesurée chez nous, pas celle de la station la plus proche.
#
# Vue Pièces : les 21 zones rangées par étage, chaque carte ouvrant la sous-vue de
# sa pièce via un tap_action explicite.
#
# ATTENTION : le tap_action de la carte de zone vaut « none » PAR DÉFAUT, et il
# n'existe aucune page de zone native vers laquelle naviguer. Sans tap_action
# explicite, appuyer sur une carte ne fait rien du tout. C'est l'erreur commise à
# l'étape 3, corrigée ici.
#
# Les sous-vues portent subview: true — elles n'apparaissent donc pas dans la barre
# d'onglets — et back_path vers /maison-v2/pieces pour le bouton retour.
#
# Les cartes de zone n'ont volontairement AUCUNE commande. La fonction
# area-controls avait été essayée : elle ajoute une à trois grosses touches par
# carte, de nombre variable selon la pièce, ce qui triple la hauteur, rend la
# grille irrégulière et noie le nom de la pièce. Les commandes sont sur la page
# de zone, à un appui.
#
# Une entité KNX sans device_class hérite d'une icône par défaut qui ne veut rien
# dire — la sirène et la simulation de présence rendaient un contour de téléphone.
# Toute entité KNX exposée doit porter une icône explicite.
#
# ATTENTION : switch.blocage_porte_de_garage est une adresse KNX 16/0/8 SANS
# state_address. Home Assistant n'a donc aucun retour : l'état affiché est
# seulement ce qu'il a écrit en dernier. Un blocage qui n'a pas pris s'affiche
# quand même « activé ». Les deux tuiles qui en dépendent restent le meilleur
# indice disponible, pas une certitude.
#
# La tuile de commande du garage est conditionnée en NÉGATIF (state_not: 'on') et
# la tuile « bloqué » en positif. Ce n'est pas symétrique par hasard : au
# redémarrage, le switch passe quelques secondes par « unavailable ». Avec deux
# conditions positives, le garage disparaîtrait complètement de l'accueil pendant
# ce temps. Avec celle-ci, ce sont les commandes qui restent — le bon défaut.
#
# Un seul bouton Départ OU Retour, jamais les deux : chacun est conditionné sur
# input_boolean.etat_depart_maison. C'est la mécanique de l'ancien accueil,
# reprise telle quelle. Le Départ garde sa confirmation, pas le Retour : armer
# l'alarme en mode vacances par erreur coûte plus cher que la désarmer.
#
# « Allumé en ce moment » est une carte glance et non entities : une grille
# d'icônes sur trois colonnes au lieu d'une ligne pleine largeur par lampe, soit
# le tiers de la hauteur. Un appui éteint la lampe, un appui long ouvre sa fiche.
# Le titre est en heading_style: subtitle pour rester en retrait — c'est une
# information de passage, pas une commande principale.
#
# ATTENTION : la carte glance ne connaît PAS tap_action au niveau de la carte —
# la documentation ne le décrit qu'entité par entité. Un tap_action posé sur la
# carte est ignoré sans erreur, et l'appui retombe sur la fiche détaillée. C'est
# pourquoi les 31 lampes portent chacune leur tap_action et leur hold_action.
#
# ATTENTION : entity-filter ne se masque PAS tout seul quand rien ne correspond.
# Son option show_empty vaut true par défaut : la carte intérieure s'affiche avec
# son titre et son icône, et zéro ligne. Les trois entity-filter portent donc
# show_empty: false. Sans ça, la section Attention montrait « Ouvrants ouverts »
# et « Défaut ruban LED » vides dès que l'alarme la faisait apparaître.
#
# La section « Allumé » teste le seul groupe light.toutes_les_lumieres, qui compte
# bien les 31 lampes depuis le 3 septembre. Elle a porté un temps un OU avec
# light.eclairage_jardin : celui-ci manquait au groupe (30 membres pour 31 lampes),
# et allumé seul il n'aurait pas déclenché la section. Le trou étant bouché côté
# helper, le contournement est retiré.
#
# La tuile « garage bloqué » est INERTE : tap_action ET hold_action valent « none »,
# et elle n'a aucune feature. C'est un panneau d'information, et c'est voulu — tant
# que le blocage est actif, la porte ne doit pas être manœuvrable depuis l'accueil.
# Trois essais ont précédé : le tap_action par défaut d'une tuile de switch vaut
# « toggle », donc appuyer n'importe où relâchait le blocage ; puis la feature
# toggle laissait un bandeau qui faisait la même chose d'un doigt ; puis
# tap_action: more-info ouvrait la fiche du switch, avec son interrupteur dedans.
# Le relâchement volontaire se fait depuis Sécurité, ou par le script Retour maison.
#
# Elle reprend EXACTEMENT le gabarit de la tuile de commande qu'elle remplace —
# 6 colonnes, 3 rangées, vertical — sinon la grille 2×2 de « Général » se déforme
# selon l'état du blocage.
#
# Le centrage (vertical: true) n'est PAS mis partout, et pas par oubli.
#
# Une tuile verticale QUI PORTE DES FEATURES ne tient pas en deux rangées : elle
# s'étale sur trois quoi qu'on demande dans grid_options, parce qu'elle empile icône,
# nom, état puis la rangée de touches. C'est ce qui déformait la grille « Général » :
# les deux tuiles du haut à 120 px, les deux volets à 184 px. En HORIZONTAL la même
# tuile y tient, icône, nom et état partageant une seule ligne au-dessus des touches.
#
# D'où le panachage : vertical pour les tuiles sans commande, qui remplissent bien
# leurs 120 px, horizontal pour celles qui portent des touches. Les quatre cases font
# la même taille — c'est ce qui compte à l'œil, plus que l'alignement interne.
#
# « Général » est une grille 2×2 de tuiles rigoureusement identiques — 6 colonnes,
# 2 rangées, vertical : Tout éteindre, Garage, Volets RDC, Volets étage. Trois rangées
# avaient été essayées : une tuile verticale avec sa rangée de touches tient en 120 px,
# les 184 px de trois rangées laissaient un tiers de vide.
#
# Le bouton Départ / Retour est centré, donc vertical, donc sur deux rangées : il
# n'existe pas de disposition centrée sur une seule rangée, vertical: true empilant
# icône et libellé. C'est un arbitrage assumé — trois essais ont précédé, pleine
# largeur sur deux rangées (un pavé pour un mot), demi-largeur (moitié droite vide),
# puis une rangée horizontale (compact mais texte à gauche). Le centrage l'emporte.
#
# « Tout éteindre » est un bouton d'action et non un interrupteur : son tap_action
# appelle light.turn_off, donc un appui éteint et ne rallume jamais. L'entité reste
# le groupe pour que la tuile se colore tant qu'il reste quelque chose à éteindre.
# L'ancienne tuile « Lumières » n'affichait que « Allumé », doublon de la section
# juste dessous, et rallumait tout au deuxième appui.
#
# Les volets passent par cover.volets_rez_de_chaussee et cover.volets_etage, deux
# groupes qui existaient déjà — 3 et 5 volets, 8 au total comme cover.tous_les_volets.
#
# « Présence » isole le bouton Départ / Retour : c'est la seule action qui change
# l'état de la maison entière, elle ne se range pas avec les commandes courantes.
#
# Les badges de température disent « Extérieur » et non « Dehors ». La section, elle,
# s'appelle « Météo » — ni « Dehors » ni « Extérieur », ce dernier désignant la zone du
# même nom qui a sa propre page de pièce.
#
# La barre de pluie ne sort QUE s'il va pleuvoir. Douze carrés blancs pour dire qu'il
# ne se passe rien, c'est douze carrés de trop : à sec, une seule ligne suffit.
#
# La météo n'est plus une carte weather-forecast mais une carte markdown, nourrie
# par sensor.previsions_launaguet (capteur modèle déclenché, dans
# configuration.yaml). Elle porte AUSSI la pluie dans l'heure, sous un filet
# horizontal : deux informations de même nature, deux cartes qui se suivaient, une
# seule désormais. Trois tentatives ont échoué avant :
#
#   show_current: false           trop haute encore
#   rows: 2 en quotidien          rogne la ligne des minimales
#   rows: 3 en quotidien          vaut exactement la hauteur automatique
#   forecast_type: hourly         tient en 2 rangées mais perd les jours
#
# grid_options ne pouvait pas réduire cette carte : le reste de sa hauteur est sa
# marge interne, que seul card-mod (HACS, exclu) atteindrait. Il fallait changer le
# contenu. La prévision n'étant plus exposée en attribut depuis 2024.4, il faut
# appeler weather.get_forecasts — d'où le capteur.
#
# Il n'y a plus de section « La maison » avec des cartes de zone : l'onglet Pièces
# fait la même chose en mieux, avec les 21 zones rangées par étage au lieu de 6.
#
# La barre de pluie du bloc Dehors est en émojis (⬜ / 🟦) et non en caractères
# semi-graphiques : les blocs ░▒▓█ n'existent pas dans toutes les polices et
# leurs largeurs divergent à la première substitution, ce qui casse l'alignement.
# Les émojis carrés sont tous rendus par la même police, à largeur constante.
---
views:
- title: Maison
  path: maison
  icon: mdi:home
  type: sections
  max_columns: 3
  theme: Backend-selected
  badges:
  - type: entity
    entity: alarm_control_panel.alarme_maison
    name: Alarme
    show_name: true
    show_state: true
  - type: entity
    entity: sensor.moyenne_temperature_interieure
    name: Intérieur
    icon: mdi:home-thermometer-outline
    show_name: true
    show_state: true
  - type: entity
    entity: sensor.moyenne_temperature_exterieure
    name: Extérieur
    icon: mdi:sun-thermometer-outline
    show_name: true
    show_state: true
  sections:
  - type: grid
    column_span: 3
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: alarm_control_panel.alarme_maison
        state:
        - triggered
        - pending
        - arming
      - condition: state
        entity: cover.porte_de_garage
        state: open
      - condition: numeric_state
        entity: sensor.pression_chaudiere_en_bar
        below: 1
      - condition: state
        entity: sensor.openstate_tydom_baie_vitree_gauche
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_baie_vitree_droit
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_fenetre_buanderie
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_fenetre_bureau
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_ouvrant_droit
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_ouvrant_droit_2
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_ouvrant_droit_3
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_ouvrant_droit_4
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_ouvrant_droit_5
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_ouvrant_droit_6
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: sensor.openstate_tydom_ouvrant_droit_7
        state:
        - UNLOCKED
        - OPENED
      - condition: state
        entity: binary_sensor.ruban_led_salon_piano_erreur_courant
        state: 'on'
      - condition: state
        entity: binary_sensor.ruban_led_salon_piano_surchauffe
        state: 'on'
      - condition: state
        entity: binary_sensor.ruban_led_double_hauteur_erreur_courant
        state: 'on'
      - condition: state
        entity: binary_sensor.ruban_led_double_hauteur_surchauffe
        state: 'on'
    cards:
    - type: heading
      heading: Attention
      heading_style: title
      icon: mdi:alert-circle-outline
    - type: tile
      entity: alarm_control_panel.alarme_maison
      name: Alarme
      color: red
      hide_state: false
      visibility:
      - condition: state
        entity: alarm_control_panel.alarme_maison
        state:
        - triggered
        - pending
        - arming
      grid_options:
        columns: full
    - type: tile
      entity: cover.porte_de_garage
      name: Porte de garage ouverte
      color: orange
      features:
      - type: cover-open-close
      visibility:
      - condition: state
        entity: cover.porte_de_garage
        state: open
      grid_options:
        columns: full
    - type: tile
      entity: sensor.pression_chaudiere_en_bar
      name: Pression chaudière basse
      color: red
      visibility:
      - condition: numeric_state
        entity: sensor.pression_chaudiere_en_bar
        below: 1
      grid_options:
        columns: full
    - type: entity-filter
      conditions:
      - condition: state
        state:
        - UNLOCKED
        - OPENED
      entities:
      - entity: sensor.openstate_tydom_baie_vitree_gauche
        name: Baie vitrée gauche
      - entity: sensor.openstate_tydom_baie_vitree_droit
        name: Baie vitrée droite
      - entity: sensor.openstate_tydom_fenetre_buanderie
        name: Fenêtre buanderie
      - entity: sensor.openstate_tydom_fenetre_bureau
        name: Fenêtre bureau
      - entity: sensor.openstate_tydom_ouvrant_droit
        name: Fenêtre salon télé
      - entity: sensor.openstate_tydom_ouvrant_droit_2
        name: Fenêtre chambre d'amis
      - entity: sensor.openstate_tydom_ouvrant_droit_3
        name: Fenêtre salle de bain
      - entity: sensor.openstate_tydom_ouvrant_droit_4
        name: Fenêtre chambre Auguste
      - entity: sensor.openstate_tydom_ouvrant_droit_5
        name: Fenêtre chambre Margaux
      - entity: sensor.openstate_tydom_ouvrant_droit_6
        name: Fenêtre chambre parentale
      - entity: sensor.openstate_tydom_ouvrant_droit_7
        name: Fenêtre salle d'eau
      card:
        type: entities
        title: Ouvrants ouverts
        state_color: true
        icon: mdi:window-open-variant
      grid_options:
        columns: full
      show_empty: false
    - type: entity-filter
      conditions:
      - condition: state
        state: 'on'
      entities:
      - binary_sensor.ruban_led_salon_piano_erreur_courant
      - binary_sensor.ruban_led_salon_piano_surchauffe
      - binary_sensor.ruban_led_double_hauteur_erreur_courant
      - binary_sensor.ruban_led_double_hauteur_surchauffe
      card:
        type: entities
        title: Défaut ruban LED
        state_color: true
        icon: mdi:led-strip-variant
      grid_options:
        columns: full
      show_empty: false
  - type: grid
    cards:
    - type: heading
      heading: Présence
      heading_style: title
      icon: mdi:home-account
    - type: tile
      entity: script.depart_maison
      name: Départ
      icon: mdi:home-export-outline
      vertical: true
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.depart_maison
        confirmation:
          text: Lancer le départ de la maison ?
      visibility:
      - condition: state
        entity: input_boolean.etat_depart_maison
        state: 'off'
      grid_options:
        columns: full
        rows: 2
    - type: tile
      entity: script.retour_maison
      name: Retour
      icon: mdi:home-import-outline
      vertical: true
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.retour_maison
      visibility:
      - condition: state
        entity: input_boolean.etat_depart_maison
        state: 'on'
      grid_options:
        columns: full
        rows: 2
  - type: grid
    cards:
    - type: heading
      heading: Général
      heading_style: title
      icon: mdi:gesture-tap-button
    - type: tile
      entity: light.toutes_les_lumieres
      name: Tout éteindre
      icon: mdi:lightbulb-off-outline
      vertical: true
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: light.turn_off
        target:
          entity_id: light.toutes_les_lumieres
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: cover.porte_de_garage
      name: Garage
      icon: mdi:garage-variant
      vertical: false
      features:
      - type: cover-open-close
      visibility:
      - condition: state
        entity: switch.blocage_porte_de_garage
        state_not: 'on'
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: switch.blocage_porte_de_garage
      name: Garage bloqué par l'alarme
      icon: mdi:garage-lock
      color: orange
      vertical: true
      hide_state: true
      tap_action:
        action: none
      hold_action:
        action: none
      visibility:
      - condition: state
        entity: switch.blocage_porte_de_garage
        state: 'on'
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: cover.volets_rez_de_chaussee
      name: Volets RDC
      icon: mdi:window-shutter
      vertical: false
      features:
      - type: cover-open-close
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: cover.volets_etage
      name: Volets étage
      icon: mdi:window-shutter
      vertical: false
      features:
      - type: cover-open-close
      grid_options:
        columns: 6
        rows: 2
  - type: grid
    visibility:
    - condition: state
      entity: light.toutes_les_lumieres
      state: 'on'
    cards:
    - type: heading
      heading: Allumé en ce moment
      heading_style: subtitle
      icon: mdi:lightbulb-on-outline
      badges:
      - type: entity
        entity: sensor.toutes
        show_state: true
        show_name: false
    - type: entity-filter
