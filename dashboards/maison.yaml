      entity: sensor.stockagereseau_volume_2_volume_utilise
      name: Volume NAS utilisé
      grid_options:
        columns: full
      color: red
    - type: entities
      title: NAS
      state_color: true
      grid_options:
        columns: full
      entities:
      - entity: binary_sensor.stockagereseau_etat_de_securite
        name: Sécurité
      - entity: sensor.stockagereseau_volume_2_etat
        name: Volume 2
      - entity: sensor.stockagereseau_drive_2_etat
        name: Disque 2
      - entity: sensor.stockagereseau_utilisation_du_processeur_totale
        name: Processeur
      - entity: sensor.stockagereseau_utilisation_de_la_memoire_reelle
        name: Mémoire
    - type: entities
      title: Ventilation
      state_color: true
      grid_options:
        columns: full
      entities:
      - entity: switch.vmc_cote_rue
        name: VMC côté rue
      - entity: switch.vmc_cote_jardi
        name: VMC côté jardin
    - type: entities
      title: Sauvegardes et mises à jour
      state_color: true
      grid_options:
        columns: full
      entities:
      - entity: event.backup_sauvegarde_automatique
        name: Dernière sauvegarde
      - entity: update.home_assistant_core_update
        name: Core
      - entity: update.home_assistant_operating_system_update
        name: OS
      - entity: update.stockagereseau_mise_a_jour_dsm
        name: DSM
  - type: grid
    cards:
    - type: heading
      heading: Alertes critiques
      heading_style: title
      icon: mdi:bell-alert
    - type: heading
      heading: Appareils
      heading_style: subtitle
      icon: mdi:cellphone-check
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set exclus = ['notify.i10_pro'] %}{% set ns = namespace(oui=[], non=[]) %}{% for e in integration_entities('mobile_app') if e.startswith('notify.') %}{% set n = state_attr(e, 'friendly_name') or e %}{% if e in exclus %}{% set ns.non = ns.non + [n] %}{% else %}{% set ns.oui = ns.oui + [n] %}{% endif %}{% endfor %}**Appareils notifiés ({{ ns.oui | count }})**
        {% for n in ns.oui %}- ✅ {{ n }}
        {% endfor %}{% if ns.non %}
        **Non notifiés ({{ ns.non | count }})**
        {% for n in ns.non %}- ⬜ {{ n }}
        {% endfor %}{% endif %}

        *Découverts seuls dans l'app Compagnon. Pour en exclure un, l'ajouter à la liste `exclus` de `script.alerte_famille` — et ici même.*
    - type: markdown
      grid_options:
        columns: full
      content: Une alerte critique perce le mode silencieux et Ne pas déranger. Les appareils
        notifiés sont découverts seuls ; les exclusions se posent en dur dans `script.alerte_famille`.
    - type: entities
      title: Par type d'alerte
      state_color: true
      grid_options:
        columns: full
      entities:
      - entity: input_boolean.critique_alarme_declenchee
        name: Alarme déclenchée
      - entity: input_boolean.critique_alarme_nuit
        name: Détection nuit
      - entity: input_boolean.critique_alarme_vacances
        name: Détection vacances
      - entity: input_boolean.critique_alarme_prealerte
        name: Pré-alerte
      - entity: input_boolean.critique_sonnette
        name: Sonnette
      - entity: input_boolean.critique_garage
        name: Garage resté ouvert
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: button
        name: Test normal
        icon: mdi:bell-ring
        icon_height: 40px
        show_name: true
        show_icon: true
        tap_action:
          action: perform-action
          perform_action: script.alerte_famille
          data:
            title: Test normal
            message: Notification standard envoyée depuis le tableau de bord.
          target: {}
      - type: button
        name: Test critique
        icon: mdi:bell-alert
        icon_height: 40px
        show_name: true
        show_icon: true
        tap_action:
          action: perform-action
          perform_action: script.alerte_famille
          data:
            title: Test critique
            message: Ceci doit percer le mode silencieux.
            critique: true
          target: {}
