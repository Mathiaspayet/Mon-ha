# Tableau de bord « Maison » (url_path: maison-v2, mode storage) — refonte, étape 2.
# Quatre vues principales — Maison, Pièces, Confort, Sécurité — plus 21 sous-vues,
# une par pièce. Reste la vue Technique, réservée au compte admin.
# Visible de tous. Aucune ressource HACS : natif Home Assistant uniquement.
#
# Le tableau de bord historique « Domolaunaguet » (url_path: lovelace) n'est pas
# touché et reste le tableau par défaut tant qu'on n'a pas basculé.
#
# La section « Attention » est conditionnée par un OU sur 18 déclencheurs : elle
# n'apparaît pas du tout quand tout va bien. Chaque carte à l'intérieur porte en
# plus sa propre condition, donc seule la ligne concernée s'affiche.
#
# Les ouvrants Tydom parlent en LOCKED / UNLOCKED, plus « unknown » au démarrage.
# Les conditions filtrent sur UNLOCKED et OPENED — une correspondance positive,
# pour qu'un « unknown » transitoire ne déclenche pas de fausse alerte.
#
# Les badges portent show_name ET show_state : sans show_name, une puce de
# personne n'affiche que « Maison » ou « Absent », sans dire de qui il s'agit.
#
# Vue Pièces : les 21 zones rangées par étage, chaque carte ouvrant la sous-vue de
# sa pièce via un tap_action explicite.
#
# ATTENTION : le tap_action de la carte de zone vaut « none » PAR DÉFAUT, et il
# n'existe aucune page de zone native vers laquelle naviguer. Sans tap_action
# explicite, appuyer sur une carte ne fait rien du tout. C'est l'erreur commise à
# l'étape 3, corrigée ici.
#
# Les sous-vues portent subview: true — elles n'apparaissent donc pas dans la barre
# d'onglets — et back_path vers /maison-v2/pieces pour le bouton retour.
#
# Les cartes de zone n'ont volontairement AUCUNE commande. La fonction
# area-controls avait été essayée : elle ajoute une à trois grosses touches par
# carte, de nombre variable selon la pièce, ce qui triple la hauteur, rend la
# grille irrégulière et noie le nom de la pièce. Les commandes sont sur la page
# de zone, à un appui.
