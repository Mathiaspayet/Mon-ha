    cards:
    - type: heading
      heading: Météo
      heading_style: title
      icon: mdi:weather-partly-cloudy
    - type: tile
      entity: sensor.31_weather_alert
      name: Vigilance Haute-Garonne
      icon: mdi:alert-decagram-outline
      color: red
      visibility:
      - condition: state
        entity: sensor.31_weather_alert
        state_not: Vert
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set p = state_attr('sensor.previsions_launaguet','jours') %}
        {%- set ic = {'sunny':'☀️','clear-night':'🌙','partlycloudy':'🌤️','cloudy':'☁️','rainy':'🌦️','pouring':'🌧️','lightning':'🌩️','lightning-rainy':'⛈️','snowy':'🌨️','snowy-rainy':'🌨️','fog':'🌫️','hail':'🧊','windy':'💨','windy-variant':'💨','exceptional':'⚠️'} %}
        {%- set noms = ['lun','mar','mer','jeu','ven','sam','dim'] %}
        {%- if not p %}
        ### 🌤️ Prévision en attente
        {%- else %}
        {%- set a = p[0] %}
        ### {{ ic.get(a.condition,'•') }} Aujourd'hui {{ a.temperature | round | int }} / {{ a.templow | round | int }} °C
        {%- set ns = namespace(l=[]) %}
        {%- for d in p[1:5] %}
        {%- set j = noms[as_local(as_datetime(d.datetime)).weekday()] %}
        {%- set ns.l = ns.l + ['%s %s %d/%d' | format(j, ic.get(d.condition,'•'), d.temperature | round | int, d.templow | round | int)] %}
        {%- endfor %}

        {{ ns.l | join(' · ') }}
        {%- endif %}
        {%- set f = state_attr('sensor.launaguet_next_rain','1_hour_forecast') %}
        {%- if f is mapping and f | count > 0 %}
        {%- set b = namespace(rows=[]) %}
        {%- for k, v in f.items() %}
        {%- set b.rows = b.rows + [[k.split(' ')[0] | int, v]] %}
        {%- endfor %}
        {%- set rows = b.rows | sort(attribute='0') %}
        {%- set n = rows | count %}
        {%- set r = namespace(bar='', debut=none, detail=[]) %}
        {%- for i in range(n) %}
        {%- set m = rows[i][0] %}
        {%- set lab = rows[i][1] %}
        {%- set fin = rows[i + 1][0] if i + 1 < n else 60 %}
        {%- set mouille = 'pluie' in (lab | lower) %}
        {%- if mouille and r.debut is none %}{% set r.debut = [m, lab] %}{% endif %}
        {%- if mouille %}{% set r.detail = r.detail + ['%d min : %s' | format(m, lab | lower | replace('pluie ', ''))] %}{% endif %}
        {%- set r.bar = r.bar + ('🟦' if mouille else '⬜') * (((fin - m) / 5) | round | int) %}
        {%- endfor %}
        {%- if r.debut is none %}

        ☀️ Pas de pluie dans l'heure
        {%- else %}

        ---
        🌧️ **{{ r.debut[1] }} {{ 'maintenant' if r.debut[0] == 0 else 'dans %d min' | format(r.debut[0]) }}**

        maintenant {{ r.bar }} +1 h

        {{ r.detail | join(' · ') }}
        {%- endif %}
        {%- endif %}
