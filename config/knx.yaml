# Purge du 3 septembre 2026 — 20 objets retirés, tous muets.
#
# Vérification à 18 h après la mise en service de la phase 2 : 32 entités KNX sur
# 158 n'avaient rien reçu depuis le redémarrage, et xknx produisait 1 086
# avertissements « KNX bus did not respond in time » en 20 h, à raison d'une
# tentative de lecture par heure et par adresse. Les 20 supprimées ici n'ont jamais
# porté de valeur, y compris sur les 7 jours d'historique conservés.
#
#   Alimentation KNX (jamais aucune valeur en 7 jours)
#     0/1/0 0/1/1 0/1/2 0/1/3   les quatre alarmes du bus
#     0/2/0 0/3/0 0/4/2         courant, tension, charge
#     0/0/1 0/0/2               temps de fonctionnement
#     0/4/0 0/4/1               statut de visualisation, dernier événement
#     0/4/3 0/4/4 0/0/3         écran et menu
#   Phase 2, jamais rien reçu en 18 h
#     12/3/0                    jour/nuit, muet sur un cycle complet jour-nuit
#     6/3/7                     HCL en cours ruban salon piano
#     6/2/13 6/2/7 6/4/13 6/4/7 les deux commandes HCL
#     12/6/0                    étalonnage du temps de déplacement des volets
#   Chaudière
#     17/0/3                    « Température H2 actuelle » — adresse fausse, pas
#                               un circuit éteint : 17/0/2 (consigne) et l'état du
#                               circuit H2 parlent toutes les dix minutes.
#
# Ce qui reste du bus est ce qui parle vraiment : l'horodatage 0/0/4, la date 0/0/5
# et l'heure 0/0/6, justes à moins de 0,6 seconde.
#
# binary_sensor.detection_chan_1 (12/5/2) est muet lui aussi mais n'a pas été
# retiré : son rôle n'est pas établi.

