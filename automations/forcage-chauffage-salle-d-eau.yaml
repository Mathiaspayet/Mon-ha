# Forçage chauffage salle d'eau
# entity_id : automation.forcage_chauffage_salle_de_bain
#   ⚠️ l'entity_id dit encore « salle_de_bain ». C'est l'identifiant d'origine (2022) ;
#   seul l'alias a été corrigé le 2026-10-22, pour ne casser aucune référence.
# Export Home Assistant du 2026-10-22 — ne pas éditer à la main sans réimport.
---
id: '1671181697200'
alias: Forçage chauffage salle d'eau
description: 'Sèche-serviettes de la salle d''eau : en marche 2 min après l''allumage de la lumière (chauffe pendant
  la douche), coupé 1 h après son extinction.


  ⚠️ CONDITION « simulation de présence à l''arrêt ». La simulation de présence peut allumer light.salle_d_eau alors
  que personne n''est à la maison, ce qui lançait une heure de chauffe pour rien. C''est la raison pour laquelle
  cette automatisation était DÉSACTIVÉE du 5 octobre au 22 octobre 2026. Ne pas retirer cette condition.


  ⚠️ L''heure de séchage est tenue par timer.sechage_salle_d_eau (restore: true), et non par un « for: » sur l''extinction
  de la lumière. Un « for: » de trigger est remis à zéro à CHAQUE redémarrage de Home Assistant, parce que le last_changed
  de l''entité est réestampillé à l''heure du démarrage. Mesuré le 22 octobre 2026 : lumière éteinte à 11:16:16,
  arrêt dû à 12:16:16, redémarrage à 11:49:52, arrêt réel à 13:00:00 — 44 minutes de sèche-serviettes en trop, dans
  une pièce déjà à 22,2 °C. Le minuteur, lui, reprend où il en était.


  Rattrapage (démarrage de HA + toutes les 15 min) : si le forçage est actif sans séchage en cours et lumière éteinte
  depuis 2 min, on coupe. Couvre le cas d''un minuteur arrivé à échéance pendant que HA était arrêté, et celui d''un
  événement d''extinction manqué sur le bus KNX.


  À savoir sur les adresses KNX : 7/1/2 est la DEMANDE envoyée à l''actionneur, 12/4/1 est sa SORTIE RÉELLE, décalée
  d''environ 60 s par la temporisation anti-battement réglée dans l''actionneur. C''est donc 12/4/1 qu''il faut
  lire pour savoir si ça chauffe, pas 7/1/2.


  La VMC (switch.vmc_cote_jardi) a été retirée des cibles : le relais KNX ne sait qu''arrêter le caisson, pas le
  booster, et la couper priverait la cuisine et la salle d''eau de ventilation.'
triggers:
- entity_id: light.salle_d_eau
  for: 00:02:00
  id: allumer
  to: 'on'
  trigger: state
- entity_id: light.salle_d_eau
  id: retour
  to: 'on'
  trigger: state
- entity_id: light.salle_d_eau
  id: debut_sechage
  to: 'off'
  trigger: state
- id: fin_sechage
  target:
    entity_id: timer.sechage_salle_d_eau
  trigger: timer.finished
- event: start
  id: rattrapage
  trigger: homeassistant
- id: rattrapage
  minutes: /15
  trigger: time_pattern
conditions: []
actions:
- choose:
  - alias: Lumière allumée depuis 2 min, hors simulation — chauffage en marche
    conditions:
    - condition: trigger
      id: allumer
    - condition: state
      entity_id: switch.presence_simulation
      state: 'off'
    sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.forcage_chauffage_salle_d_eau
  - alias: Retour dans la pièce — on annule le séchage en cours
    conditions:
    - condition: trigger
      id: retour
    - condition: state
      entity_id: switch.presence_simulation
      state: 'off'
    - condition: state
      entity_id: timer.sechage_salle_d_eau
      state: active
    sequence:
    - action: timer.cancel
      target:
        entity_id: timer.sechage_salle_d_eau
  - alias: Lumière éteinte — une heure de séchage
    conditions:
    - condition: trigger
      id: debut_sechage
    - condition: state
      entity_id: switch.forcage_chauffage_salle_d_eau
      state: 'on'
    sequence:
    - action: timer.start
      target:
        entity_id: timer.sechage_salle_d_eau
  - alias: Fin du séchage — arrêt du forçage
    conditions:
    - condition: trigger
      id: fin_sechage
    sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.forcage_chauffage_salle_d_eau
  - alias: Rattrapage — forçage actif sans séchage en cours
    conditions:
    - condition: trigger
      id: rattrapage
    - condition: state
      entity_id: switch.forcage_chauffage_salle_d_eau
      state: 'on'
    - condition: state
      entity_id: timer.sechage_salle_d_eau
      state: idle
    - condition: state
      entity_id: light.salle_d_eau
      for: 00:02:00
      state: 'off'
    sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.forcage_chauffage_salle_d_eau
max: 5
mode: queued
