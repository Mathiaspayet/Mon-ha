# Garage / Alerte si garage resté ouvert.
# entity_id : automation.alerte_si_garage_reste_ouvert
# Export Home Assistant du 2026-08-30 — ne pas éditer à la main sans réimport.
---
id: '1701510308199'
alias: Garage / Alerte si garage resté ouvert.
description: Plus de 30min
triggers:
- entity_id:
  - binary_sensor.capteur_garage
  for:
    hours: 0
    minutes: 15
    seconds: 0
  from: 'on'
  to: 'off'
  trigger: state
conditions:
- condition: state
  for:
    hours: 0
    minutes: 0
    seconds: 0
  entity_id: cover.porte_de_garage
  state: open
actions:
- repeat:
    sequence:
    - action: notify.mobile_app_pixel_9a
      data: {}
    - data:
        message: 'Porte de garage restée ouverte '
        title: 'Attention '
      action: notify.mobile_app_iphone_marine
    - delay:
        hours: 0
        minutes: 10
        seconds: 0
        milliseconds: 0
    while:
    - condition: state
      entity_id: cover.porte_de_garage
      state: open
mode: single
