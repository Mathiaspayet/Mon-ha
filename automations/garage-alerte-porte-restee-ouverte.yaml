# Garage / Alerte si garage resté ouvert.
# entity_id : automation.alerte_si_garage_reste_ouvert
# Export Home Assistant du 2026-09-02 — ne pas éditer à la main sans réimport.
---
id: '1701510308199'
alias: Garage / Alerte si garage resté ouvert.
description: Plus de 30min
triggers:
- entity_id:
  - binary_sensor.capteur_garage
  for:
    hours: 0
    minutes: 15
    seconds: 0
  from: 'on'
  to: 'off'
  trigger: state
conditions:
- condition: state
  for:
    hours: 0
    minutes: 0
    seconds: 0
  entity_id: cover.porte_de_garage
  state: open
actions:
- repeat:
    sequence:
    - alias: Notification aux telephones actives
      action: script.alerte_famille
      data:
        title: Attention
        message: Porte de garage restée ouverte
    - delay:
        hours: 0
        minutes: 10
        seconds: 0
        milliseconds: 0
    while:
    - condition: state
      entity_id: cover.porte_de_garage
      state: open
mode: single
