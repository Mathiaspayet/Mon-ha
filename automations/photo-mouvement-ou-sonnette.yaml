# Prendre une photo en cas de mouvement ou sonnette
# entity_id : automation.notification_si_mouvement
#   ⚠️ l'entity_id parle de « notification » mais cette automatisation n'en envoie
#   aucune : c'est l'identifiant d'origine, conservé pour ne casser aucune
#   référence. La notification de sonnette est dans
#   automation.sonette_quand_qqn_sonne.
# Export Home Assistant du 2026-10-24 — ne pas éditer à la main sans réimport.
#
# ── DEUX FICHIERS, PUIS LA LISTE FEUILLETABLE ──────────────────────────────
#
#   capture/capture_interphone.jpg
#       Emplacement fixe, écrasé à chaque fois. Lu par la caméra générique
#       « Dernière capture » (camera.127_0_0_1).
#
#   capture/Archive/capture_interphone_<HHhMMminSSsec_JJ-MM-AAAA>.jpg
#       L'historique, horodaté dans le nom. Purgé à 10 jours (864 000 s) par
#       delete.files_in_folder, en fin de séquence.
#
#   puis input_select.capture_interphone_choisie reçoit le nouveau nom en tête
#   de ses options. C'est cette liste que la tuile de la vue Sécurité fait
#   défiler, via image.capture_interphone dont l'URL est le nom sélectionné.
#
# ── POURQUOI LE NOM EST FIGÉ DANS UNE VARIABLE ─────────────────────────────
# Il sert DEUX fois : pour écrire le fichier, puis pour l'ajouter aux options.
# Recalculer now() une seconde fois donnerait un nom décalé d'une seconde, et
# l'option désignerait un fichier qui n'existe pas. Même piège que n'importe
# quelle valeur lue deux fois dans une séquence.
#
# ── L'ORDRE PROTÈGE ────────────────────────────────────────────────────────
# set_options vient APRÈS la capture. Si camera.snapshot échoue, la séquence
# s'arrête là et aucune option ne pointe sur un fichier absent.
#
# ── LA TUILE SAUTE TOUJOURS SUR LA NOUVELLE CAPTURE ────────────────────────
# C'est le rôle de input_select.select_first en fin de séquence, et c'est
# VOULU : vérifié le 24 octobre 2026, être positionné sur la capture de la
# veille à 10:13:01 n'empêche pas la tuile de sauter sur celle de 06:12:54 dès
# qu'elle arrive.
# La variante « ne suivre que si on était déjà sur la plus récente » a été
# proposée à Mathias et ÉCARTÉE par lui : il veut toujours voir la dernière.
# Ne pas retirer select_first en croyant corriger un défaut.
#
# ── LE FILTRE DES 10 JOURS ─────────────────────────────────────────────────
# La liste est reconstruite à chaque capture : nouveau nom en tête, doublons
# retirés par « unique », et noms de plus de 10 jours écartés — la date est
# relue DANS LE NOM du fichier, strptime rendant « none » sur un nom qui ne
# correspond pas au format. C'est ce filtre qui évite qu'une option survive au
# fichier que delete.files_in_folder a supprimé. Le plafond de 30 n'est là que
# pour garder la liste déroulante utilisable.
#
# ── POURQUOI PAS LE COMPOSANT « folder » ───────────────────────────────────
# Il exposerait directement la liste des fichiers du répertoire, ce qui serait
# plus simple. Mais il exige un bloc allowlist_external_dirs dans
# configuration.yaml, donc un REDÉMARRAGE. Ici, une aide input_select tenue à
# jour par l'automatisation suffit, sans rien redémarrer.
#
---
id: '1680770329206'
alias: 'Prendre une photo en cas de mouvement ou sonnette '
description: 'Capture l''interphone à chaque personne détectée ou coup de sonnette, en deux exemplaires, puis met à jour la
  liste des captures feuilletables.


  1. capture_interphone.jpg — emplacement fixe, écrasé à chaque fois, lu par la caméra générique « Dernière capture ».

  2. Archive/capture_interphone_<horodatage>.jpg — l''historique, purgé à 10 jours par delete.files_in_folder en fin de séquence.


  Le nom du fichier d''archive est figé dans une variable AVANT la capture, parce qu''il sert deux fois : pour écrire le fichier,
  puis pour l''ajouter aux options de input_select.capture_interphone_choisie. Recalculer now() une seconde fois donnerait
  un nom décalé d''une seconde, et l''option pointerait sur un fichier inexistant.


  La liste des options est reconstruite à chaque capture : nouveau nom en tête, doublons retirés, noms de plus de 10 jours
  écartés (la date est relue dans le nom du fichier), et plafond à 30 pour que la liste déroulante reste utilisable. Le filtre
  sur 10 jours est ce qui évite qu''une option survive au fichier que delete.files_in_folder a supprimé.


  L''ordre compte : set_options vient APRÈS la capture. Si camera.snapshot échouait, la séquence s''arrête avant, et aucune
  option ne désigne un fichier absent.


  NB : l''entity_id dit « notification_si_mouvement » mais cette automatisation n''envoie aucune notification — c''est l''identifiant
  d''origine, conservé pour ne casser aucune référence. La notification de sonnette est dans automation.sonette_quand_qqn_sonne.'
triggers:
- entity_id:
  - binary_sensor.interphone_person
  from: 'off'
  to: 'on'
  trigger: state
- entity_id:
  - binary_sensor.interphone_visitor
  from: 'off'
  to: 'on'
  trigger: state
conditions: []
actions:
- alias: Nom du fichier d'archive, figé une seule fois
  variables:
    fichier: capture_interphone_{{ now().strftime('%Hh%Mmin%Ssec_%d-%m-%Y') }}.jpg
- alias: Emplacement fixe, pour la caméra générique
  action: camera.snapshot
  data:
    entity_id: camera.interphone_main
    filename: /config/www/sonette/capture/capture_interphone.jpg
- alias: Archive horodatée, purgée à 10 jours
  action: camera.snapshot
  data:
    entity_id: camera.interphone_main
    filename: /config/www/sonette/capture/Archive/{{ fichier }}
- alias: 'Liste feuilletable : nouveau en tête, 10 jours maxi, 30 maxi'
  action: input_select.set_options
  target:
    entity_id: input_select.capture_interphone_choisie
  data:
    options: '{% set ns = namespace(l=[]) %}{% for o in ([fichier] + (state_attr(''input_select.capture_interphone_choisie'',''options'')
      or [])) | unique %}{% set d = strptime(o[19:], ''%Hh%Mmin%Ssec_%d-%m-%Y.jpg'', none) %}{% if d is not none and (now().date()
      - d.date()).days < 10 %}{% set ns.l = ns.l + [o] %}{% endif %}{% endfor %}{{ ns.l[:30] }}'
- alias: Afficher la plus récente
  action: input_select.select_first
  target:
    entity_id: input_select.capture_interphone_choisie
- delay:
    hours: 0
    minutes: 0
    seconds: 2
    milliseconds: 0
- action: delete.files_in_folder
  data:
    folder: /config/www/sonette/capture/Archive/
    only_extensions:
    - .jpg
    time: 864000
mode: single

# --- DÉPENDANCES ----------------------------------------------------------
#   input_select.capture_interphone_choisie   helpers/input_select.yaml
#   image.capture_interphone                  helpers/modeles_et_historiques.yaml
#   delete.files_in_folder                    intégration « delete » (HACS),
#                                             déclarée par « delete: » dans
#                                             configuration.yaml
#
# --- HISTORIQUE -----------------------------------------------------------
#
# 2026-10-24, deuxième essai. Le premier écrivait une TROISIÈME copie dans un
# tampon circulaire de 12 fichiers à noms fixes (defilement/capture_0..11.jpg),
# avec un compteur et un curseur de recul. Ça marchait, mais c'était une
# mauvaise idée : le tampon partait vide et aurait mis une semaine à se
# remplir, le curseur offrait 11 crans pour 2 images réellement disponibles, et
# les noms fixes perdaient l'horodatage. Pendant ce temps, 45 captures
# horodatées et bien différentes dormaient dans l'archive.
# Le compteur, le curseur et le répertoire defilement/ ont été supprimés.
