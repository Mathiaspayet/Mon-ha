# Sonette quand qqn sonne
# entity_id : automation.sonette_quand_qqn_sonne
# Export Home Assistant du 2026-10-24 — ne pas éditer à la main sans réimport.
#
# ── LE CARILLON NE PASSE PAS PAR HOME ASSISTANT ────────────────────────────
# Le carillon D'ORIGINE, celui livré avec l'interphone Reolink, est apparié en
# direct avec lui et sonne par sa propre liaison. Il n'y a RIEN à configurer
# dans Home Assistant, et rien à y chercher.
# C'est la bonne architecture pour une sonnette : il sonne même Pi éteint, box
# éteinte, Home Assistant à l'arrêt. Le Pi est tombé 14 minutes le 23 octobre
# 2026 — un carillon qui en dépendrait n'aurait prévenu personne.
# Home Assistant ne s'occupe donc QUE de la notification aux téléphones.
#
# ⚠️ ET HOME ASSISTANT NE LE VOIT PAS.
#   Diagnostic de l'intégration reolink, relevé le 24 octobre 2026 :
#     "model"              : Reolink Video Doorbell PoE
#     "firmware version"   : v3.0.0.6460_2605211898
#     "Chimes"             : {}            ← aucun carillon connu de la caméra
#     "supportDingDongCtrl": permit 0      ← pas de gestion de carillon du tout
#   (« DingDong » est le nom interne du carillon chez Reolink.)
#   Conséquence : aucune entité de carillon n'existe dans Home Assistant, et
#   number.interphone_volume_de_la_sonnette comme number.interphone_speak_volume
#   restent « unavailable ». CE N'EST PAS UNE PANNE — c'est le micrologiciel de
#   l'interphone qui ne remonte rien. Le volume et la sonnerie se règlent sur le
#   carillon lui-même ou dans l'application Reolink, pas ici.
#   Ne pas chercher à recréer ces entités ni à recharger l'intégration pour les
#   faire apparaître : elles n'apparaîtront pas.
#
# ── CE QUE FAIT CETTE AUTOMATISATION ───────────────────────────────────────
# Déclencheur : binary_sensor.interphone_visitor passe de off à on.
# Action      : une notification aux téléphones via script.alerte_famille,
#               avec l'image de l'interphone, en trois variantes.
#
#   Criticité demandée  → mode critique intact, + image / icône / clickAction
#   Nuit (21 h – 8 h)   → canal « Sonnette nuit », importance normale
#   Jour                → canal « Sonnette », importance haute
#
# OÙ SE RÈGLE LE SON DE LA NOTIFICATION (Android)
#   Le champ « channel » crée un canal de notification dédié. C'est dans le
#   téléphone qu'on lui donne sa sonnerie et son volume :
#     Paramètres > Applications > Home Assistant > Notifications > « Sonnette »
#   Deux canaux séparés, jour et nuit, pour un signal fort le jour et discret la
#   nuit. ⚠️ L'importance d'un canal Android est FIGÉE à sa création : un canal
#   unique avec deux valeurs d'« importance » ne marcherait pas, d'où les deux.
#   Sur iPhone, le son reste celui des notifications de l'application.
#
# ⚠️ POURQUOI UNE BRANCHE À PART POUR LE MODE CRITIQUE
#   script.alerte_famille fusionne le bloc « donnees » PAR-DESSUS son payload
#   critique (« Écrase les clés du mode critique en cas de conflit », dit sa
#   propre description). Passer « channel » et « importance » quand
#   input_boolean.critique_sonnette est actif écraserait le canal alarm_stream
#   sur Android et le son critique sur Apple — donc annulerait précisément ce
#   que le mode critique apporte. La première branche ne passe donc que les
#   clés sans conflit : image, icône, clickAction.
#   Vérifié par rendu des trois payloads le 24 octobre : les clés critiques
#   (alarm_stream, ttl, priority, importance, color, sticky / push.sound) sont
#   toutes conservées.
#
# L'image est le flux SOUS-RÉSOLUTION (camera.interphone_sub) : le flux
# principal accumule les délais d'attente RTSP, et la vignette d'une
# notification n'a pas besoin de 2 K. L'instantané archivé sur disque reste
# l'affaire de automation.notification_si_mouvement (alias « Prendre une photo
# en cas de mouvement ou sonnette »), qui tourne en parallèle sur le même
# déclencheur.
#
---
id: '1681055973731'
alias: Sonette quand qqn sonne
description: 'Prévient la maison quand quelqu''un sonne à l''interphone.


  Le carillon, lui, ne passe pas par Home Assistant : c''est un carillon Reolink relié à l''interphone, qui sonne par sa propre
  liaison. C''est la bonne architecture pour une sonnette — il sonne même Pi éteint. Home Assistant ne s''occupe donc que
  de la notification aux téléphones, avec l''image de l''interphone.


  ⚠️ Home Assistant ne VOIT pas ce carillon et ne peut ni régler son volume ni changer sa sonnerie. L''interphone (Reolink
  Video Doorbell PoE, micrologiciel v3.0.0.6460) rapporte « Chimes: {} » et « supportDingDongCtrl: permit 0 » : son micrologiciel
  n''a pas la gestion de carillon. C''est pour cette raison que number.interphone_volume_de_la_sonnette et number.interphone_speak_volume
  restent indisponibles — ce n''est pas une panne. Le volume du carillon se règle sur le carillon lui-même ou dans l''application
  Reolink.


  Le champ « channel » règle le son de la NOTIFICATION sur Android : Paramètres > Applications > Home Assistant > Notifications
  > Sonnette. Deux canaux séparés, jour et nuit, car l''importance d''un canal Android est figée à sa création.


  Si input_boolean.critique_sonnette est actif, on ne passe ni channel ni importance : script.alerte_famille fusionne « donnees
  » par-dessus son payload critique, et ces deux clés écraseraient le canal alarm_stream sur Android et le son critique sur
  Apple.'
triggers:
- entity_id:
  - binary_sensor.interphone_visitor
  from: 'off'
  to: 'on'
  trigger: state
conditions: []
actions:
- choose:
  - alias: 'Alerte critique demandée : laisser le mode critique intact'
    conditions:
    - condition: state
      entity_id: input_boolean.critique_sonnette
      state: 'on'
    sequence:
    - action: script.alerte_famille
      data:
        title: Sonnette maison
        message: Quelqu'un sonne !
        alerte: sonnette
        donnees:
          image: /api/camera_proxy/camera.interphone_sub
          notification_icon: mdi:bell-ring
          clickAction: /maison-v2/securite
  - alias: 'Nuit (21 h - 8 h) : canal discret'
    conditions:
    - condition: time
      after: '21:00:00'
      before: 08:00:00
    sequence:
    - action: script.alerte_famille
      data:
        title: Sonnette maison
        message: Quelqu'un sonne !
        alerte: sonnette
        donnees:
          channel: Sonnette nuit
          importance: default
          image: /api/camera_proxy/camera.interphone_sub
          notification_icon: mdi:bell-ring
          clickAction: /maison-v2/securite
  default:
  - alias: 'Jour : canal sonore, importance haute'
    action: script.alerte_famille
    data:
      title: Sonnette maison
      message: Quelqu'un sonne !
      alerte: sonnette
      donnees:
        channel: Sonnette
        importance: high
        image: /api/camera_proxy/camera.interphone_sub
        notification_icon: mdi:bell-ring
        clickAction: /maison-v2/securite
max: 3
mode: queued

# --- HISTORIQUE -----------------------------------------------------------
#
# 2026-10-24 — Six actions mortes supprimées. La version d'origine pilotait une
# enceinte de la salle à manger qui n'existe plus ; la deuxième de ses sept
# actions appelait un service d'une intégration absente, et une action
# inexistante arrête la séquence sans autre trace qu'une ligne de journal. La
# notification partait donc, le son non, et rien ne le signalait. L'entrée de
# configuration correspondante a été supprimée le même jour, à la demande de
# Mathias. Aucune de ces actions ne doit être réintroduite : le carillon de la
# sonnette est le carillon Reolink, pas une enceinte réseau.
