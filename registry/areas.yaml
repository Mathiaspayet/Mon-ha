# Registre des zones et des étages — refonte de l'interface, étape 1 (2026-09-02).
# 3 étages, 21 zones, aucune zone non rattachée.
#
# Deux zones créées, deux corrections apportées par Mathias :
#   - « Garage » (RDC) : l'éclairage du garage, la porte, son blocage et le
#     capteur d'alarme n'avaient aucune zone.
#   - « Patio » rattaché à l'ÉTAGE, pas à l'extérieur : le patio est à ce niveau.
#   - « Cabanon » supprimé, il n'existe pas.
#   - L'extérieur garde ses trois éclairages : terrasse, Porsche/travées et
#     jardin. Ce dernier sert peu mais existe bien.
#
# temperature_entity_id_souhaite : ce champ n'est PAS écrit ici. Le serveur MCP
# refuse la commande config/area_registry/update et l'outil dédié ne l'expose
# pas. À renseigner à la main dans Paramètres > Zones et étiquettes > la zone >
# « Capteur de température ». Sans lui, la carte de zone n'affiche pas la
# température toute seule et il faut la nommer dans chaque carte.
