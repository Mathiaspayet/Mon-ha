# Helpers counter (mode storage).
# Export Home Assistant du 2026-10-24.
---
captures_interphone:
  name: Captures interphone
  icon: mdi:camera-burst
  initial: 0
  minimum: 0
  step: 1
  restore: true
  # Compteur MONOTONE, sans maximum : il ne sert pas à compter pour compter,
  # mais à désigner l'emplacement du tampon circulaire de 12 captures de
  # l'interphone, par « compteur modulo 12 ». Il donne aussi le nombre
  # d'emplacements réellement remplis, min(compteur, 12), ce qui permet
  # d'écrêter le curseur de recul et de ne jamais pointer sur un fichier
  # absent. restore: true est indispensable — remis à zéro, il ferait
  # réécrire par-dessus des captures encore affichables.
