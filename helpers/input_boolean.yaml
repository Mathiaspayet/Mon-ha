# --- Criticité des notifications -------------------------------------------
# Lus par script.alerte_famille via son champ `alerte`. Convention :
#   input_boolean.critique_<id d'alerte>
# Activé = la notification perce le silencieux et Ne pas déranger.
# Pilotés depuis la vue « Réglages » du tableau de bord (compte admin).
#
# Le choix des DESTINATAIRES ne passe plus par des helpers : tout appareil de
# l'app Compagnon est notifié, sauf ceux listés en dur dans la variable
# `exclus` de scripts/alerte_famille.yaml.
critique_alarme_declenchee:
